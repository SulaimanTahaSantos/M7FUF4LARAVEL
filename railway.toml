[build]
builder = "nixpacks"
buildCommand = "nixpacks build . --no-cache"
nixpacksConfigPath = "nixpacks.toml"

[deploy]
startCommand = "php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "on_failure"

[variables]
APP_ENV = "local"
LOG_CHANNEL = "stack"
APP_DEBUG = "true"
